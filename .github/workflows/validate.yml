name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validators
        run: |
          pip install check-jsonschema
          npm install --global markdownlint-cli2
      - name: openssl version
        run: openssl version
      - name: make validate lint test-vectors
        run: make validate lint test-vectors
